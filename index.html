<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지?</title>
<style>
  :root { --bg:#fff8f0; --card:#fff; --ink:#2b2b2b; --sub:#777; --main:#ff6b35; --line:#eee; }
  @media (prefers-color-scheme: dark) { :root { --bg:#1c1b1a; --card:#2a2826; --ink:#f2f2f2; --sub:#aaa; --line:#3a3734; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,"Pretendard","Malgun Gothic",sans-serif; }
  main { max-width:520px; margin:0 auto; padding:24px 16px 60px; }
  h1 { text-align:center; margin:8px 0 4px; }
  .sub { text-align:center; color:var(--sub); margin:0 0 20px; font-size:14px; }
  .card { background:var(--card); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 2px 10px rgba(0,0,0,.06); }
  #result { text-align:center; font-size:32px; font-weight:800; min-height:56px; display:flex; align-items:center; justify-content:center; }
  #resultCat { text-align:center; color:var(--sub); min-height:20px; }
  button { font:inherit; cursor:pointer; border:none; border-radius:12px; }
  #spin { width:100%; padding:16px; font-size:20px; font-weight:700; background:var(--main); color:#fff; margin-top:12px; }
  #spin:disabled { opacity:.6; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { padding:6px 12px; background:var(--line); color:var(--ink); font-size:14px; }
  .chip.on { background:var(--main); color:#fff; }
  form { display:flex; gap:8px; flex-wrap:wrap; }
  input, select { font:inherit; padding:10px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  input { flex:1; min-width:140px; }
  input[type=checkbox] { flex:none; min-width:0; width:22px; height:22px; padding:0; margin:0; accent-color:var(--main); cursor:pointer; }
  #kList label { cursor:pointer; }
  .add { padding:10px 16px; background:var(--ink); color:var(--bg); }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li { display:flex; justify-content:space-between; align-items:center; padding:10px 4px; border-bottom:1px solid var(--line); }
  li small { color:var(--sub); margin-left:6px; }
  .del { background:none; color:var(--sub); font-size:18px; }
  h2 { font-size:16px; margin:0 0 12px; }
  label.opt { display:flex; gap:6px; align-items:center; font-size:14px; color:var(--sub); margin-top:12px; }
</style>
</head>
<body>
<main>
  <h1>🍽️ 오늘 뭐 먹지?</h1>
  <p class="sub">버튼 한 번으로 점심 고민 끝</p>

  <div class="card">
    <div id="result">?</div>
    <div id="resultCat"></div>
    <div class="chips" id="filters" style="margin-top:12px"></div>
    <label class="opt"><input type="checkbox" id="noRepeat"> 최근 간 곳 3곳은 제외</label>
    <button id="spin">🎲 랜덤 뽑기</button>
    <button type="button" id="goBtn" class="add" style="display:none;width:100%;margin-top:8px">✅ 여기로 갈게요 (기록하기)</button>
    <div style="margin-top:16px;border-top:1px solid var(--line);padding-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <b style="font-size:14px">🕘 최근 간 곳 <small id="histMode" style="font-weight:400;color:var(--sub)"></small></b>
        <button type="button" class="del" id="clearHist" style="font-size:13px">기록 지우기</button>
      </div>
      <ul id="hist" style="margin-top:4px"></ul>
    </div>
  </div>

  <div class="card" id="syncCard">
    <div id="syncMsg" style="font-size:14px;color:var(--sub)">공유 목록 불러오는 중...</div>
    <div id="syncBtns" style="display:none;gap:8px;flex-wrap:wrap;margin-top:10px">
      <button type="button" class="add" id="exportBtn">📤 GitHub에 저장하기</button>
      <button type="button" class="chip" id="resetBtn">GitHub 목록으로 되돌리기</button>
    </div>
    <div id="exportBox" style="display:none;margin-top:12px;font-size:14px">
      <ol style="padding-left:20px;margin:0 0 8px;line-height:1.7">
        <li>아래 <b>복사</b> 버튼을 누르세요.</li>
        <li><a id="ghEdit" target="_blank" rel="noopener" style="color:var(--main)">GitHub 편집 화면 열기</a> → 기존 내용을 모두 지우고(Ctrl+A) 붙여넣기(Ctrl+V)</li>
        <li>오른쪽 위 초록색 <b>Commit changes</b> 클릭</li>
        <li>1~2분 뒤 모두에게 새 목록이 보여요.</li>
      </ol>
      <textarea id="exportText" readonly style="width:100%;height:140px;font:12px monospace;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);padding:8px"></textarea>
      <button type="button" class="add" id="copyBtn" style="width:100%;margin-top:6px">복사</button>
    </div>
  </div>

  <div class="card">
    <h2>식당 추가</h2>
    <form id="addForm">
      <input id="name" placeholder="식당 이름" required>
      <select id="cat"></select>
      <button class="add">추가</button>
    </form>
    <ul id="list"></ul>
  </div>

  <div class="card">
    <h2>📍 카카오맵으로 주변 식당 불러오기</h2>
    <form id="kakaoForm">
      <input id="kKey" placeholder="카카오 JavaScript 키 (처음 한 번만)">
      <input id="kPlace" placeholder="회사 주소 또는 건물명 (예: 강남역)" style="min-width:100%">
      <select id="kRadius">
        <option value="300">300m</option><option value="500" selected>500m</option><option value="1000">1km</option>
      </select>
      <button class="add" id="kSearch">검색</button>
      <button type="button" class="add" id="kHere">현재 위치</button>
    </form>
    <div id="kMsg" style="color:var(--sub);font-size:14px;margin-top:8px"></div>
    <div id="kTools" style="display:none;gap:8px;margin-top:10px">
      <button type="button" class="chip" id="kAll">전체 선택</button>
      <button type="button" class="chip" id="kNone">전체 해제</button>
    </div>
    <ul id="kList"></ul>
    <button type="button" class="add" id="kAdd" style="display:none;width:100%;margin-top:10px">선택한 식당 추가</button>
  </div>
</main>
<script>
const CATS = ["한식","중식","일식","양식","분식","기타"];
const KEY = "lunch-picker-v1";
const GH_EDIT = "https://github.com/jlaw080-ops/random-table/edit/main/restaurants.json";
let data = { items: [], history: [], filter: [], dirty: false };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) data = s; } catch(e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch(e) {} };
const $ = id => document.getElementById(id);
data.history = (data.history || []).map(h => typeof h === "string" ? { name: h, at: null } : h);
const recentNames = () => data.history.slice(-3).map(h => h.name);
const fmtDate = t => { if (!t) return ""; const d = new Date(t);
  return `${d.getMonth()+1}/${d.getDate()}(${"일월화수목금토"[d.getDay()]})`; };
function renderHist() {
  const recent3 = data.history.length - 3;
  $("hist").innerHTML = data.history.slice().reverse().map((h, ri) => {
    const i = data.history.length - 1 - ri;
    return `<li style="${i >= recent3 ? "" : "opacity:.5"}"><span>${esc(h.name)}<small>${fmtDate(h.at)}${i >= recent3 ? " · 제외 대상" : ""}</small></span>
      <button class="del" data-h="${i}" title="이 기록 삭제">✕</button></li>`; }).join("")
    || `<li style="color:var(--sub);font-size:14px">아직 기록이 없어요. 뽑은 뒤 '여기로 갈게요'를 누르면 기록돼요.</li>`;
}
let lastPick = null;
let shared = null; // restaurants.json 내용
const markDirty = () => { data.dirty = true; save(); syncUI(); };
let listTeam = false; // true면 변경 즉시 GitHub 자동 저장
async function listApi(method, body) {
  const r = await fetch("/api/restaurants", { method, headers: { "Content-Type": "application/json" },
    ...(body && { body: JSON.stringify(body) }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `오류 ${r.status}`);
  return j;
}
function applyShared(j) {
  shared = { kakaoKey: j.kakaoKey || "", restaurants: j.restaurants || [] };
  data.items = shared.restaurants.slice(); data.dirty = false; save(); render();
  if (shared.kakaoKey) { $("kKey").value = shared.kakaoKey; $("kKey").style.display = "none"; }
  syncUI();
}
async function listChange(method, body, localFn) {
  if (!listTeam) { localFn(); render(); markDirty(); return true; }
  $("syncMsg").textContent = "💾 GitHub에 저장 중...";
  try { applyShared(await listApi(method, body)); return true; }
  catch (e) { $("syncMsg").textContent = "⚠️ 저장 실패: " + e.message; return false; }
}
const addItems = items => listChange("POST", { items }, () => data.items.push(...items));
function syncUI() {
  if (!shared) return;
  if (listTeam) {
    $("syncBtns").style.display = "none"; $("exportBox").style.display = "none";
    $("syncMsg").innerHTML = `✅ 팀 공유 목록 ${data.items.length}곳 · 추가/삭제하면 GitHub에 자동 저장돼요.`;
    return;
  }
  $("syncBtns").style.display = data.dirty ? "flex" : "none";
  $("syncMsg").innerHTML = data.dirty
    ? "✏️ <b>이 기기에서 목록을 바꿨어요.</b> 모두와 공유하려면 GitHub에 저장하세요."
    : `✅ 공유 목록(GitHub) ${data.items.length}곳을 쓰고 있어요.`;
}
function exportJson() {
  return JSON.stringify({ kakaoKey: shared?.kakaoKey || kSet.key || "",
    restaurants: data.items.map(({name,cat,url,dist}) => ({name,cat,...(url&&{url}),...(dist&&{dist})})) }, null, 2);
}

$("cat").innerHTML = CATS.map(c => `<option>${c}</option>`).join("");

function render() {
  $("filters").innerHTML = CATS.map(c =>
    `<button class="chip ${data.filter.includes(c)?"on":""}" data-c="${c}">${c}</button>`).join("");
  $("list").innerHTML = data.items.map((it,i) =>
    `<li><span>${esc(it.name)}<small>${it.cat}</small></span><button class="del" data-i="${i}" title="삭제">✕</button></li>`).join("")
    || `<li style="color:var(--sub)">식당을 추가해 주세요</li>`;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

$("filters").onclick = e => {
  const c = e.target.dataset.c; if (!c) return;
  data.filter = data.filter.includes(c) ? data.filter.filter(x=>x!==c) : [...data.filter, c];
  save(); render();
};
$("list").onclick = e => {
  const i = e.target.dataset.i; if (i === undefined) return;
  const it = data.items[i];
  if (listTeam && !confirm(`'${it.name}'을(를) 팀 목록에서 삭제할까요?`)) return;
  listChange("DELETE", { name: it.name }, () => data.items.splice(i, 1));
};
$("addForm").onsubmit = e => {
  e.preventDefault();
  const name = $("name").value.trim(); if (!name) return;
  if (data.items.some(it => it.name === name)) return alert("이미 목록에 있는 식당이에요.");
  addItems([{ name, cat: $("cat").value }]).then(ok => { if (ok) $("name").value = ""; });
};

$("spin").onclick = () => {
  let pool = data.items.filter(it => !data.filter.length || data.filter.includes(it.cat));
  if ($("noRepeat").checked) {
    const recent = recentNames();
    const p2 = pool.filter(it => !recent.includes(it.name));
    if (p2.length) pool = p2;
  }
  if (!pool.length) { $("result").textContent = "후보가 없어요"; $("resultCat").textContent=""; return; }
  $("spin").disabled = true; $("resultCat").textContent = ""; $("goBtn").style.display = "none";
  let n = 0, total = 18;
  const tick = () => {
    const pick = pool[Math.floor(Math.random()*pool.length)];
    $("result").textContent = pick.name;
    if (++n < total) setTimeout(tick, 40 + n*12);
    else {
      $("resultCat").innerHTML = `${pick.cat}${pick.dist?` · ${pick.dist}m`:""} · 오늘은 여기로! 🎉` +
        (pick.url ? ` <a href="${esc(pick.url)}" target="_blank" rel="noopener" style="color:var(--main)">지도 보기</a>` : "");
      lastPick = pick; $("goBtn").style.display = "block"; $("spin").disabled = false;
    }
  };
  tick();
};
// ----- 방문 기록: 팀 공유(서버) 또는 이 기기 저장 -----
let teamMode = false;
const histLabel = t => $("histMode").textContent = t;
async function teamApi(method, body) {
  const r = await fetch("/api/history", { method, headers: { "Content-Type": "application/json" },
    ...(body && { body: JSON.stringify(body) }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `오류 ${r.status}`);
  return j;
}
async function histChange(method, body, localFn) {
  if (!teamMode) { localFn(); save(); renderHist(); return true; }
  histLabel("저장 중...");
  try { data.history = await teamApi(method, body); save(); renderHist(); histLabel("👥 팀 공유"); return true; }
  catch (e) { histLabel("⚠️ 저장 실패: " + e.message); return false; }
}
$("goBtn").onclick = async () => {
  if (!lastPick) return;
  const pick = lastPick; $("goBtn").disabled = true;
  const ok = await histChange("POST", { name: pick.name },
    () => { data.history.push({ name: pick.name, at: Date.now() }); data.history = data.history.slice(-10); });
  $("goBtn").disabled = false;
  if (ok) { $("goBtn").style.display = "none"; lastPick = null;
    $("resultCat").insertAdjacentHTML("beforeend", " · 기록했어요 ✍️"); }
};
$("hist").onclick = e => {
  const i = e.target.dataset.h; if (i === undefined) return;
  const h = data.history[i];
  histChange("DELETE", { name: h.name, at: h.at }, () => data.history.splice(i, 1));
};
$("clearHist").onclick = () => {
  if (!data.history.length || !confirm(teamMode ? "팀 전체의 방문 기록을 모두 지울까요?" : "방문 기록을 모두 지울까요?")) return;
  histChange("DELETE", { all: true }, () => { data.history = []; });
};
function loadTeamHist() {
  return teamApi("GET").then(list => {
    teamMode = true; data.history = list; save(); renderHist(); histLabel("👥 팀 공유");
  }).catch(() => { if (!teamMode) histLabel("📱 이 기기에만 저장"); });
}
render(); renderHist(); loadTeamHist();
document.addEventListener("visibilitychange", () => { if (!document.hidden && teamMode) loadTeamHist(); });

// ===== 카카오맵 주변 식당 불러오기 =====
const KKEY = "lunch-picker-kakao";
let kSet = {};
try { kSet = JSON.parse(localStorage.getItem(KKEY)) || {}; } catch(e) {}
$("kKey").value = kSet.key || ""; $("kPlace").value = kSet.place || "";
let found = [];
const SVC_ERR = "❌ 2단계 실패: 지도는 불러왔지만 검색이 거부됐어요. 카카오 개발자 사이트 > 내 애플리케이션 > (제품 설정) 카카오맵 에서 '사용 설정'을 ON 해 주세요.";
const kMsg = t => $("kMsg").textContent = t;

// 카카오 분류("음식점 > 한식 > 찌개") → 앱 분류
function mapCat(c) {
  const s = c.split(">").map(x=>x.trim())[1] || "";
  if (s === "한식") return "한식"; if (s === "중식") return "중식";
  if (s === "일식") return "일식"; if (s === "양식") return "양식";
  if (s === "분식") return "분식"; return "기타";
}

let sdkPromise = null;
function loadSdk(key) {
  if (window.kakao?.maps?.services) return Promise.resolve();
  if (sdkPromise) return sdkPromise;
  sdkPromise = new Promise((ok, fail) => {
    const s = document.createElement("script");
    s.src = `https://dapi.kakao.com/v2/maps/sdk.js?appkey=${encodeURIComponent(key)}&libraries=services&autoload=false`;
    const t = setTimeout(() => { sdkPromise = null; s.remove(); fail(); }, 8000);
    s.onload = () => {
      if (!window.kakao?.maps?.load) { clearTimeout(t); sdkPromise = null; s.remove(); return fail(); }
      kakao.maps.load(() => { clearTimeout(t); ok(); });
    };
    s.onerror = () => { clearTimeout(t); sdkPromise = null; s.remove(); fail(); };
    document.head.appendChild(s);
  });
  return sdkPromise;
}

async function ready() {
  const key = $("kKey").value.trim();
  if (!key) { kMsg("카카오 JavaScript 키를 입력해 주세요."); return false; }
  if (window.kakao?.maps?.services && kSet.key && kSet.key !== key) {
    kSet.key = key; try { localStorage.setItem(KKEY, JSON.stringify(kSet)); } catch(e) {}
    location.reload(); return false; // 키를 바꾸면 새로 불러오기
  }
  kSet.key = key; kSet.place = $("kPlace").value.trim();
  try { localStorage.setItem(KKEY, JSON.stringify(kSet)); } catch(e) {}
  try { await loadSdk(key); return true; }
  catch { kMsg("❌ 1단계 실패: 카카오 지도를 불러오지 못했어요. ① JavaScript 키가 맞는지(REST API 키 X) ② 플랫폼 > Web 사이트 도메인에 " + location.origin + " 이 등록됐는지 확인해 주세요."); return false; }
}

function searchNear(lat, lng) {
  const ps = new kakao.maps.services.Places();
  const loc = new kakao.maps.LatLng(lat, lng);
  found = [];
  kMsg("주변 식당 찾는 중...");
  ps.categorySearch("FD6", (res, status, pg) => {
    if (status === kakao.maps.services.Status.OK) {
      found.push(...res);
      if (pg.hasNextPage && pg.current < 3) return pg.nextPage(); // 최대 45곳
    }
    else if (status === kakao.maps.services.Status.ERROR && !found.length) return kMsg(SVC_ERR);
    found.sort((a,b) => a.distance - b.distance);
    showFound();
  }, { location: loc, radius: Number($("kRadius").value), sort: kakao.maps.services.SortBy.DISTANCE });
}

function showFound() {
  const have = new Set(data.items.map(i => i.name));
  if (!found.length) { kMsg("주변에서 식당을 찾지 못했어요."); $("kList").innerHTML=""; $("kAdd").style.display="none"; $("kTools").style.display="none"; return; }
  kMsg(`${found.length}곳을 찾았어요. 추가할 식당을 고르세요.`);
  $("kList").innerHTML = found.map((p,i) => `<li><label style="display:flex;gap:8px;align-items:center;flex:1">
    <input type="checkbox" data-k="${i}" ${have.has(p.place_name)?"disabled":"checked"}>
    <span>${esc(p.place_name)}<small>${mapCat(p.category_name)} · ${p.distance}m${have.has(p.place_name)?" · 이미 있음":""}</small></span></label>
    <a href="${esc(p.place_url)}" target="_blank" rel="noopener" style="font-size:13px;color:var(--main)">지도</a></li>`).join("");
  $("kAdd").style.display = "block"; $("kTools").style.display = "flex";
}
const setAll = v => document.querySelectorAll("#kList input:not(:disabled)").forEach(cb => cb.checked = v);
$("kAll").onclick = () => setAll(true);
$("kNone").onclick = () => setAll(false);

$("kakaoForm").onsubmit = async e => {
  e.preventDefault();
  if (!(await ready())) return;
  const q = $("kPlace").value.trim();
  if (!q) return kMsg("회사 주소나 건물명을 입력해 주세요.");
  kMsg("위치 찾는 중...");
  new kakao.maps.services.Geocoder().addressSearch(q, (r, st) => {
    if (st === kakao.maps.services.Status.OK) return searchNear(r[0].y, r[0].x);
    new kakao.maps.services.Places().keywordSearch(q, (r2, st2) => {
      if (st2 === kakao.maps.services.Status.OK) searchNear(r2[0].y, r2[0].x);
      else if (st2 === kakao.maps.services.Status.ERROR) kMsg(SVC_ERR);
      else kMsg("위치를 찾지 못했어요. 다른 이름으로 검색해 보세요.");
    });
  });
};

$("kHere").onclick = async () => {
  if (!(await ready())) return;
  if (!navigator.geolocation) return kMsg("이 브라우저는 위치 기능을 지원하지 않아요.");
  kMsg("현재 위치 확인 중...");
  navigator.geolocation.getCurrentPosition(
    p => searchNear(p.coords.latitude, p.coords.longitude),
    () => kMsg("위치 권한이 거부되었어요. 주소로 검색해 주세요."));
};

$("kAdd").onclick = async () => {
  const items = [...document.querySelectorAll("#kList input:checked:not(:disabled)")].map(cb => {
    const p = found[cb.dataset.k];
    return { name: p.place_name, cat: mapCat(p.category_name), url: p.place_url, dist: Number(p.distance) };
  });
  if (!items.length) return kMsg("선택한 식당이 없어요. 체크박스를 눌러 골라 주세요.");
  $("kAdd").disabled = true;
  const ok = await addItems(items);
  $("kAdd").disabled = false;
  if (!ok) return kMsg("저장에 실패했어요. 잠시 후 다시 시도해 주세요.");
  showFound();
  kMsg(listTeam ? `${items.length}곳을 추가했어요! 팀 목록에 자동 저장됐어요.` : `${items.length}곳을 추가했어요! 위의 'GitHub에 저장하기'로 공유하세요.`);
};

// ===== GitHub 공유 목록 (restaurants.json) =====
$("ghEdit").href = GH_EDIT;
$("exportBtn").onclick = () => {
  $("exportText").value = exportJson();
  $("exportBox").style.display = $("exportBox").style.display === "none" ? "block" : "none";
};
$("copyBtn").onclick = async () => {
  try { await navigator.clipboard.writeText($("exportText").value); }
  catch { $("exportText").select(); document.execCommand("copy"); }
  $("copyBtn").textContent = "복사됨! 이제 GitHub 편집 화면에 붙여넣으세요";
};
$("resetBtn").onclick = () => {
  if (!confirm("이 기기에서 바꾼 내용을 버리고 GitHub 목록으로 되돌릴까요?")) return;
  data.items = shared.restaurants.slice(); data.dirty = false; save(); render(); syncUI();
  $("exportBox").style.display = "none";
};
// 1순위: 서버 API(자동 저장) → 실패하면 2순위: 배포된 restaurants.json(수동 저장)
listApi("GET").then(async j => {
  listTeam = true;
  const pending = data.dirty ? data.items.filter(it => !j.restaurants.some(r => r.name === it.name)) : [];
  if (pending.length) { try { j = await listApi("POST", { items: pending }); } catch {} } // 저장 안 했던 추가분 올리기
  applyShared(j);
}).catch(() => loadStatic());
function loadStatic() { return fetch("restaurants.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw 0; return r.json(); })
  .then(j => {
    shared = { kakaoKey: j.kakaoKey || "", restaurants: Array.isArray(j.restaurants) ? j.restaurants : [] };
    const same = JSON.stringify(shared.restaurants.map(r=>r.name)) === JSON.stringify(data.items.map(r=>r.name));
    if (data.dirty && same) data.dirty = false; // GitHub에 저장 완료된 경우
    if (!data.dirty) { data.items = shared.restaurants.slice(); save(); render(); }
    if (shared.kakaoKey) { // 공유 키가 있으면 키 입력 불필요
      $("kKey").value = shared.kakaoKey; $("kKey").style.display = "none";
    }
    syncUI();
  })
  .catch(() => { $("syncMsg").textContent = "⚠️ 공유 목록을 불러오지 못해 이 기기에 저장된 목록을 쓰고 있어요."; });
}
</script>
</body>
</html>
